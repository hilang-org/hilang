name: ci

on:
  push:
    branches: [master]
  pull_request:

# GitHub deprecated Node 20 on 2025-09-19; the proper fix
# is to bump every action to a release that runs on Node 24.
# actions/checkout@v6 (2025-11-20) is on Node 24. mlugg/
# setup-zig is still on Node 20 as of v2.2.1 (2026-01-19) —
# its README hasn't tagged a Node 24 release yet, so we set
# FORCE_JAVASCRIPT_ACTIONS_TO_NODE24=true at the workflow
# level to force the new runtime for that one. Drop the env
# var when setup-zig ships a Node 24 release.
env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: "true"

jobs:
  build-test:
    # Build, test, and bench on both supported targets. macos-latest
    # is Apple Silicon (M-series) since GitHub flipped the default
    # in 2024; ubuntu-24.04-arm is the public ARM64 Linux runner.
    # Both are aarch64 — hilang's JIT is AArch64-only by design.
    strategy:
      fail-fast: false
      matrix:
        runner:
          - macos-latest
          - ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Install Zig
        uses: mlugg/setup-zig@v2
        with:
          version: 0.16.0

      - name: Build (Debug)
        run: zig build

      - name: Build (ReleaseFast)
        run: zig build -Doptimize=ReleaseFast

      # Tests are JIT-driven and take ~minutes per leg in
      # ReleaseFast on the Apple Silicon runner. The Linux ARM
      # build hits the same code path with the JIT disabled
      # (we only support AArch64 macOS for codegen so far) —
      # the resulting bytecode-only run is slow enough that
      # GitHub-hosted runners cancel before completion. Skip
      # the test leg on Linux until the JIT learns to emit on
      # Linux too; the build legs above still validate that
      # the source tree compiles end-to-end on aarch64-linux.
      - name: Test
        if: matrix.runner != 'ubuntu-24.04-arm'
        run: zig build test -Doptimize=ReleaseFast --summary all
